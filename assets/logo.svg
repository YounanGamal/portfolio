<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Bracket < -->
  <path d="M 28 11 L 12 24 L 28 37" stroke="url(#purpleGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#purpleGlow)"/>
  <!-- YG Initials -->
  <text x="42" y="35" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" fill="currentColor" letter-spacing="-0.03em">YG</text>
  <!-- Slash / -->
  <line x1="98" y1="37" x2="112" y2="11" stroke="url(#purpleGrad)" stroke-width="5" stroke-linecap="round" filter="url(#purpleGlow)"/>
  <!-- Bracket > -->
  <path d="M 126 11 L 142 24 L 126 37" stroke="url(#purpleGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#purpleGlow)"/>
</svg>
